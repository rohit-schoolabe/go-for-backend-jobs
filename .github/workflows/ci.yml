name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          out=$(find . -name '*.go' -not -path '*/broken/*' \
            | xargs gofmt -l)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        if: matrix.go == 'stable'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          make lint

      - name: test
        run: go test -race -cover ./...

  postgres:
    name: test against PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shelf
          POSTGRES_PASSWORD: shelf
          POSTGRES_DB: shelf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelf"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: store and api tests on PostgreSQL
        env:
          SHELF_TEST_DSN: >-
            postgres://shelf:shelf@localhost:5432/shelf_test?sslmode=disable
        run: go test -race -p 1 ./ch19/...

  image:
    name: docker image
    needs: [test, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -f ch19/Dockerfile -t shelf:ci .

      - name: push and release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          docker tag shelf:ci "$image"
          docker push "$image"
          gh release create "$TAG" --generate-notes
